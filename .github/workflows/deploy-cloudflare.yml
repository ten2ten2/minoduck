name: Deploy Cloudflare
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency: { group: production-cloudflare, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NUXT_PUBLIC_APP_URL: https://app.minoduck.ai
      NUXT_PUBLIC_SITE_URL: https://www.minoduck.ai
      NUXT_PUBLIC_CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:locales && pnpm test && pnpm typecheck
      - run: pnpm --filter @minoduck/site deploy
      - run: pnpm --filter @minoduck/console deploy
      - run: pnpm --filter @minoduck/site exec wrangler deploy --config ../../infra/cloudflare/wrangler.jsonc
