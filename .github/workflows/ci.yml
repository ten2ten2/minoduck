name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with: { node-version-file: '.node-version' }
      - uses: pnpm/action-setup@v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:locales
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: minoduck_test }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run: { working-directory: services/backend }
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/minoduck_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          {
            go-version-file: services/backend/go.mod,
            cache-dependency-path: services/backend/go.sum,
          }
      - run: go mod verify
      - run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
      - run: git diff --exit-code -- internal/dbgen
      - name: Check gofmt
        run: |
          gofmt -w .
          git diff --exit-code -- .
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build ./cmd/...
