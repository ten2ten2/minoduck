databases:
  - name: minoduck-db
    databaseName: minoduck
    user: minoduck_migrator
    postgresMajorVersion: '18'
    plan: basic-256mb
    region: oregon
    ipAllowList: []
envVarGroups:
  - name: minoduck-backend
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_URL
        value: https://app.minoduck.ai
      - key: DATABASE_URL
        sync: false
      - key: BFF_SERVICE_TOKEN
        generateValue: true
      - key: PROVIDER_ENCRYPTION_MASTER_KEY
        sync: false
      - key: PROVIDER_KEY_ID
        value: v1
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PORTAL_CONFIGURATION
        sync: false
      - key: STRIPE_PRICE_STARTER_MONTHLY
        sync: false
      - key: STRIPE_PRICE_STARTER_YEARLY
        sync: false
      - key: STRIPE_PRICE_TEAM_MONTHLY
        sync: false
      - key: STRIPE_PRICE_TEAM_YEARLY
        sync: false
services:
  - type: web
    name: minoduck-api
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./services/backend/Dockerfile
    dockerContext: ./services/backend
    dockerCommand: /app/api
    healthCheckPath: /readyz
    autoDeployTrigger: off
    preDeployCommand: /app/migrate
    envVars:
      - fromGroup: minoduck-backend
      - key: MIGRATION_DATABASE_URL
        fromDatabase: { name: minoduck-db, property: connectionString }
  - type: worker
    name: minoduck-worker
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./services/backend/Dockerfile
    dockerContext: ./services/backend
    dockerCommand: /app/worker
    autoDeployTrigger: off
    envVars:
      - fromGroup: minoduck-backend
  - type: cron
    name: minoduck-scheduler
    runtime: docker
    plan: starter
    region: oregon
    schedule: '*/5 * * * *'
    dockerfilePath: ./services/backend/Dockerfile
    dockerContext: ./services/backend
    dockerCommand: /app/scheduler
    autoDeployTrigger: off
    envVars:
      - fromGroup: minoduck-backend
